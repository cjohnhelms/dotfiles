# Neutral status bar theme — deliberately colorless so it doesn't clash
# with whichever nvim colorscheme is active (catppuccin, tokyonight,
# gruvbox, kanagawa, vscode, github-dark-dimmed).

set -g status-style "bg=#1c1c1c,fg=#c0c0c0"

# current window: subtle highlight, no strong hue
set -g window-status-current-style "bg=#3a3a3a,fg=#ffffff,bold"
set -g window-status-style "bg=#1c1c1c,fg=#808080"
set -g window-status-current-format "  #I:#W  "
set -g window-status-format " #I:#W "

# session name / left side
set -g status-left-style "fg=#c0c0c0"
set -g status-left " #S "

# right side: window/pane info
set -g status-right-style "fg=#808080"
set -g status-right " %H:%M "

set -g status-justify left
set -g status-left-length 20
set -g status-right-length 40

# pane borders: keep neutral too
set -g pane-border-style "fg=#3a3a3a"
set -g pane-active-border-style "fg=#808080"
